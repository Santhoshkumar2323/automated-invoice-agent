name: pipeline

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Invoices to process (leave blank to use config.yaml)"
        required: false
        default: ""
        type: string
      defect:
        description: "Force one kind of problem (MIXED means the normal random mix)"
        required: false
        default: MIXED
        type: choice
        options:
          - MIXED
          - NONE
          - BAD_CHECKSUM
          - SUSPENDED_VENDOR
          - REVOKED_VENDOR
          - UNKNOWN_VENDOR
          - WRONG_TOTAL
          - DUPLICATE_INVOICE
      force:
        description: "Run now even if a run is not due yet"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: invoice-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the packages needed for the schedule check
        run: pip install "pydantic>=2.9,<3" pyyaml python-dotenv

      - name: Decide whether a run is due
        id: due
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            echo "Manual run requested, so the schedule check is skipped."
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            python -m src.due
          fi

      - name: Install all packages
        if: steps.due.outputs.due == 'true'
        run: pip install -r requirements.txt

      - name: Cache the browser download
        if: steps.due.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install the browser
        if: steps.due.outputs.due == 'true'
        run: playwright install --with-deps chromium

      - name: Start the ledger website
        if: steps.due.outputs.due == 'true'
        run: |
          streamlit run app/ledger_app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          echo $! > streamlit.pid
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health > /dev/null; then
              echo "The ledger website is up."
              exit 0
            fi
            sleep 2
          done
          cat streamlit.log
          echo "The ledger website did not start."
          exit 1

      - name: Run the pipeline
        if: steps.due.outputs.due == 'true'
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          COUNT: ${{ inputs.count }}
          DEFECT: ${{ inputs.defect }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLAMA_CLOUD_API_KEY: ${{ secrets.LLAMA_CLOUD_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY != '' }}
          LANGSMITH_PROJECT: invoice-agent
        run: |
          args=""
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            args="$args --force"
          fi
          case "$COUNT" in
            ''|*[!0-9]*) ;;
            *) args="$args --count $COUNT" ;;
          esac
          case "$DEFECT" in
            NONE|BAD_CHECKSUM|SUSPENDED_VENDOR|REVOKED_VENDOR|UNKNOWN_VENDOR|WRONG_TOTAL|DUPLICATE_INVOICE)
              args="$args --defect $DEFECT" ;;
          esac
          echo "Running: python -m src.main$args"
          python -m src.main $args

      - name: Show the latest report on this page
        if: always() && steps.due.outputs.due == 'true'
        run: |
          latest=$(ls -1 reports/run_*.md 2>/dev/null | sort | tail -n 1 || true)
          if [ -n "$latest" ]; then
            echo "### Latest report: $latest" >> "$GITHUB_STEP_SUMMARY"
            cat "$latest" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop the ledger website
        if: always() && steps.due.outputs.due == 'true'
        run: |
          if [ -f streamlit.pid ]; then
            kill "$(cat streamlit.pid)" || true
          fi

      - name: Save results to the repository
        if: always() && steps.due.outputs.due == 'true'
        run: |
          git config user.name "invoice-agent-bot"
          git config user.email "invoice-agent-bot@users.noreply.github.com"
          git add -A data reports screenshots
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "Pipeline run ${GITHUB_RUN_NUMBER}: update results"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi